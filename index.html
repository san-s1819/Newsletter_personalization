<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Our AI Newsletter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'ai-blue': '#3b82f6', // Example blue
                        'ai-purple': '#8b5cf6', // Example purple
                        'ai-dark': '#111827', // Dark background
                        'ai-light-text': '#f3f4f6',
                        'ai-input-bg': '#1f2937',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0f1f 0%, #1a1f3a 100%);
            color: #e0e7ff;
            min-height: 100vh;
            padding: 1rem;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .form-container {
            background: rgba(22, 27, 41, 0.95);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(129, 140, 248, 0.3);
            border: 1px solid #2c334b;
            backdrop-filter: blur(10px);
        }
        
        .form-title {
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #818cf8, #c084fc, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .form-subtitle {
            text-align: center;
            color: #a5b4fc;
            margin-bottom: 3rem;
            font-size: 1.1rem;
        }
        
        /* Two Column Layout */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: stretch; /* Ensure equal heights */
        }
        
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
        }
        
        .form-section {
            display: flex;
            flex-direction: column;
            height: 100%; /* Fill the available height */
            min-height: 500px; /* Minimum height for both columns */
            background: rgba(31, 41, 55, 0.3); /* Subtle background */
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid rgba(59, 75, 113, 0.5);
        }
        
        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #c7d2fe;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #3b4b71;
            flex-shrink: 0; /* Don't shrink the title */
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #a5b4fc;
            font-size: 0.95rem;
        }
        
        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border-radius: 8px;
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #d1d5db;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.3);
        }
        
        /* Experience Radio Buttons */
        .experience-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin-top: 0.5rem;
        }
        
        @media (max-width: 480px) {
            .experience-options {
                grid-template-columns: 1fr;
            }
        }
        
        .experience-option {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            background-color: #1f2937;
            border-radius: 8px;
            border: 1px solid #374151;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .experience-option:hover {
            background-color: #2c334b;
            border-color: #818cf8;
        }
        
        .experience-option input[type="radio"] {
            appearance: none;
            width: 1.25em;
            height: 1.25em;
            border: 2px solid #6b7280;
            border-radius: 50%;
            margin-right: 0.75em;
            cursor: pointer;
            position: relative;
        }
        
        .experience-option input[type="radio"]:checked {
            background-color: #818cf8;
            border-color: #818cf8;
        }
        
        .experience-option input[type="radio"]:checked::before {
            content: '';
            display: block;
            width: 0.65em;
            height: 0.65em;
            background-color: white;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .experience-option label {
            color: #d1d5db;
            cursor: pointer;
            font-size: 0.9rem;
        }
        
        /* Make the categories section fill remaining space */
        .categories-container {
            flex: 1; /* Take up remaining space */
            display: flex;
            flex-direction: column;
        }
        
        /* Multi-select Categories */
        .categories-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.5rem;
            margin-top: 0.5rem;
            flex: 1; /* Take up available space */
            max-height: 400px; /* Increased max height */
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        
        .category-option {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            background-color: #1f2937;
            border-radius: 6px;
            border: 1px solid #374151;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .category-option:hover {
            background-color: #2c334b;
            border-color: #818cf8;
        }
        
        .category-option input[type="checkbox"] {
            appearance: none;
            width: 1.25em;
            height: 1.25em;
            border: 2px solid #6b7280;
            border-radius: 4px;
            margin-right: 0.75em;
            cursor: pointer;
            position: relative;
        }
        
        .category-option input[type="checkbox"]:checked {
            background-color: #818cf8;
            border-color: #818cf8;
        }
        
        .category-option input[type="checkbox"]:checked::before {
            content: '✓';
            display: block;
            color: white;
            font-size: 0.9em;
            font-weight: bold;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .category-option label {
            color: #d1d5db;
            cursor: pointer;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        
        /* Action Buttons */
        .button-container {
            grid-column: 1 / -1;
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .action-button {
            padding: 0.875rem 2rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            min-width: 140px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
        }
        
        .btn-secondary {
            background: rgba(129, 140, 248, 0.1);
            color: #818cf8;
            border: 1px solid #818cf8;
        }
        
        .btn-tertiary {
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            border: 1px solid #22c55e;
        }
        
        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .action-button:active {
            transform: translateY(0);
        }
        
        .action-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Message Box */
        .message-box {
            grid-column: 1 / -1;
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
        
        .message-box.success {
            background-color: rgba(74, 222, 128, 0.2);
            color: #4ade80;
            border: 1px solid #4ade80;
        }
        
        .message-box.error {
            background-color: rgba(248, 113, 113, 0.2);
            color: #f87171;
            border: 1px solid #f87171;
        }
        
        /* Custom Scrollbar */
        .categories-grid::-webkit-scrollbar {
            width: 6px;
        }
        
        .categories-grid::-webkit-scrollbar-track {
            background: #1f2937;
            border-radius: 3px;
        }
        
        .categories-grid::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 3px;
        }
        
        .categories-grid::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h1 class="form-title">Ctrl Alt AI</h1>
            <p class="form-subtitle">Subscribe to your personalized AI newsletter with curated content based on your interests and experience.</p>

            <form id="aiNewsletterForm">
                <div class="form-grid">
                    <!-- Left Column: Personal Information -->
                    <div class="form-section">
                        <h2 class="section-title">Personal Information</h2>
                        
                        <div class="form-group">
                            <label for="name" class="form-label">Full Name *</label>
                            <input type="text" id="name" name="name" class="form-input" placeholder="e.g., Ada Lovelace" required>
                        </div>

                        <div class="form-group">
                            <label for="email" class="form-label">Email Address *</label>
                            <input type="email" id="email" name="email" class="form-input" placeholder="ada@example.com" required>
                        </div>

                        <div class="form-group">
                            <label for="linkedin" class="form-label">LinkedIn Profile URL (Optional)</label>
                            <input type="url" id="linkedin" name="linkedin" class="form-input" placeholder="https://linkedin.com/in/yourprofile">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Experience Level with AI *</label>
                            <div class="experience-options">
                                <div class="experience-option">
                                    <input type="radio" id="exp_beginner" name="experience_level" value="Beginner" required>
                                    <label for="exp_beginner">Beginner</label>
                                </div>
                                <div class="experience-option">
                                    <input type="radio" id="exp_intermediate" name="experience_level" value="Intermediate">
                                    <label for="exp_intermediate">Intermediate</label>
                                </div>
                                <div class="experience-option">
                                    <input type="radio" id="exp_advanced" name="experience_level" value="Advanced">
                                    <label for="exp_advanced">Advanced</label>
                                </div>
                                <div class="experience-option">
                                    <input type="radio" id="exp_expert" name="experience_level" value="Expert">
                                    <label for="exp_expert">Expert</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column: AI Interests -->
                    <div class="form-section">
                        <h2 class="section-title">AI Interests</h2>
                        <p class="form-label">Select your areas of interest (multiple selections allowed) *</p>
                        
                        <div class="categories-container">
                            <div class="categories-grid">
                                <div class="category-option">
                                    <input type="checkbox" id="cat_industry" name="ai_topics" value="Industry & Corporate Updates">
                                    <label for="cat_industry">Industry & Corporate Updates</label>
                                </div>
                                <div class="category-option">
                                    <input type="checkbox" id="cat_policy" name="ai_topics" value="Government, Policy & Geopolitics">
                                    <label for="cat_policy">Government, Policy & Geopolitics</label>
                                </div>
                                <div class="category-option">
                                    <input type="checkbox" id="cat_sustainability" name="ai_topics" value="Sustainability & Data Center News">
                                    <label for="cat_sustainability">Sustainability & Data Center News</label>
                                </div>
                                <div class="category-option">
                                    <input type="checkbox" id="cat_robotics" name="ai_topics" value="Robotics & Autonomous Systems">
                                    <label for="cat_robotics">Robotics & Autonomous Systems</label>
                                </div>
                                <div class="category-option">
                                    <input type="checkbox" id="cat_llm" name="ai_topics" value="LLMs, NLP & Language Model Advances">
                                    <label for="cat_llm">LLMs, NLP & Language Model Advances</label>
                                </div>
                                <div class="category-option">
                                    <input type="checkbox" id="cat_research" name="ai_topics" value="Core ML Research & Tutorials">
                                    <label for="cat_research">Core ML Research & Tutorials</label>
                                </div>
                                <div class="category-option">
                                    <input type="checkbox" id="cat_accessibility" name="ai_topics" value="AI & Accessibility / Social Good">
                                    <label for="cat_accessibility">AI & Accessibility / Social Good</label>
                                </div>
                                <div class="category-option">
                                    <input type="checkbox" id="cat_quantum" name="ai_topics" value="Quantum & High-Performance Computing">
                                    <label for="cat_quantum">Quantum & High-Performance Computing</label>
                                </div>
                                <div class="category-option">
                                    <input type="checkbox" id="cat_frameworks" name="ai_topics" value="ML Frameworks, Tools & Engineering">
                                    <label for="cat_frameworks">ML Frameworks, Tools & Engineering</label>
                                </div>
                                <div class="category-option">
                                    <input type="checkbox" id="cat_vision" name="ai_topics" value="Computer Vision & Multimodal Innovations">
                                    <label for="cat_vision">Computer Vision & Multimodal Innovations</label>
                                </div>
                                <div class="category-option">
                                    <input type="checkbox" id="cat_misc" name="ai_topics" value="Miscellaneous / Thought Leadership">
                                    <label for="cat_misc">Miscellaneous / Thought Leadership</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="button-container">
                        <button type="submit" class="action-button btn-primary" id="subscribeBtn">
                            Subscribe Now
                        </button>
                    </div>

                    <!-- Message Box -->
                    <div id="messageBox" class="message-box"></div>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Form handling JavaScript
        const form = document.getElementById('aiNewsletterForm');
        const messageBox = document.getElementById('messageBox');
        const subscribeBtn = document.getElementById('subscribeBtn');
        const verifyBtn = document.getElementById('verifyBtn');
        const modifyBtn = document.getElementById('modifyBtn');

        // Form submission handler
        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            // Clear previous messages
            hideMessage();

            // Get form data
            const formData = new FormData(form);
            const data = {
                name: formData.get('name'),
                email: formData.get('email'),
                linkedin: formData.get('linkedin'),
                experience_level: formData.get('experience_level'),
                ai_topics: formData.getAll('ai_topics') // Get all selected checkboxes
            };

            // Validation
            if (!data.name || !data.email || !data.experience_level) {
                showMessage('Please fill in all required fields.', 'error');
                return;
            }

            if (!validateEmail(data.email)) {
                showMessage('Please enter a valid email address.', 'error');
                return;
            }

            if (data.ai_topics.length === 0) {
                showMessage('Please select at least one area of interest.', 'error');
                return;
            }

            // Update button state
            setButtonLoading(subscribeBtn, 'Subscribing...');

            try {
                // Send data to backend
                const response = await fetch('http://localhost:3001/api/subscribe', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data),
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage(result.message || 'Successfully subscribed!', 'success');
                    // Don't reset form - user might want to verify or modify
                } else {
                    showMessage(result.message || 'Subscription failed. Please try again.', 'error');
                }
            } catch (error) {
                console.error('Submission error:', error);
                showMessage('An error occurred. Please check your connection and try again.', 'error');
            } finally {
                resetButtonState(subscribeBtn, 'Subscribe Now');
            }
        });

        // Verify button handler (placeholder for future implementation)
        verifyBtn.addEventListener('click', function() {
            const email = document.getElementById('email').value;
            if (!email) {
                showMessage('Please enter your email address first.', 'error');
                return;
            }
            showMessage('Verification feature coming soon!', 'success');
        });

        // Modify preferences handler (placeholder for future implementation)
        modifyBtn.addEventListener('click', function() {
            showMessage('Preference modification feature coming soon!', 'success');
        });

        // Utility functions
        function showMessage(message, type) {
            messageBox.textContent = message;
            messageBox.className = `message-box ${type}`;
            messageBox.style.display = 'block';
            
            // Auto-hide after 5 seconds
            setTimeout(hideMessage, 5000);
        }

        function hideMessage() {
            messageBox.style.display = 'none';
            messageBox.textContent = '';
            messageBox.className = 'message-box';
        }

        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(String(email).toLowerCase());
        }

        function setButtonLoading(button, text) {
            button.textContent = text;
            button.disabled = true;
        }

        function resetButtonState(button, text) {
            button.textContent = text;
            button.disabled = false;
        }
    </script>
</body>
</html>
